<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客 - 欢迎</title>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/custom.css" rel="stylesheet">
    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/playfair-display/index.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/dm-sans/index.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; overflow: hidden; }
        body {
            height: 100vh;
            max-height: 100vh;
            background: var(--bg-primary);
            font-family: var(--font-body);
            color: var(--text-primary);
            position: relative;
            display: flex;
            flex-direction: column;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(17, 24, 39, 0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(148, 163, 184, 0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat; pointer-events: none; z-index: 0;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes accentPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ====== HERO ====== */
        .hero-section {
            position: relative; z-index: 5;
            padding: 32px 48px 16px;
            text-align: center;
            animation: fadeSlideUp 0.6s ease both;
            max-width: 1200px; margin: 0 auto;
            flex-shrink: 0;
        }
        .hero-section h1 {
            font-family: var(--font-display); font-size: 2.6rem; font-weight: 900;
            color: var(--text-primary); letter-spacing: -0.03em; line-height: 1.1;
            margin-bottom: 10px;
        }
        .hero-section h1 span {
            background: linear-gradient(135deg, var(--accent) 0%, #374151 50%, var(--accent) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: shimmer 4s linear infinite;
        }
        .hero-subtitle {
            font-size: 0.95rem; color: var(--text-muted); font-weight: 400;
            letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px;
        }
        .hero-divider {
            width: 40px; height: 2px; background: var(--accent);
            margin: 0 auto 16px; border-radius: 2px; opacity: 0.4;
        }
        .hero-actions {
            display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
        }
        .btn-hero {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 28px; border-radius: 10px;
            font-family: var(--font-body); font-size: 0.92rem; font-weight: 700;
            letter-spacing: 0.03em; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none; border: none; position: relative; overflow: hidden;
        }
        .btn-hero-primary {
            background: var(--accent); color: var(--bg-primary);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.2);
        }
        .btn-hero-primary::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            transition: left 0.5s;
        }
        .btn-hero-primary:hover {
            background: var(--accent-hover); color: var(--bg-primary);
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.35); transform: translateY(-2px);
        }
        .btn-hero-primary:hover::before { left: 100%; }
        .btn-hero-ghost {
            background: transparent; color: var(--text-secondary);
            border: 1.5px solid var(--border-subtle);
        }
        .btn-hero-ghost:hover {
            color: var(--accent); border-color: var(--border-accent);
            background: var(--accent-glow); transform: translateY(-2px);
        }

        /* User info */
        .user-info-wrapper {
            position: fixed; top: 20px; right: 24px; z-index: 100;
        }
        .user-chip {
            position: relative;
            display: inline-flex; align-items: center;
        }
        .user-chip-trigger {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 7px 8px 7px 8px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 48px; border: 1px solid var(--border-subtle);
            cursor: pointer; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(17,24,39,0.06), inset 0 1px 0 rgba(255,255,255,0.04);
            text-decoration: none; color: inherit;
        }
        .user-chip-trigger:hover {
            border-color: var(--border-accent);
            box-shadow: 0 6px 28px rgba(17,24,39,0.08), 0 0 0 1px rgba(17, 24, 39, 0.1);
            transform: translateY(-1px);
        }
        .user-chip.open .user-chip-trigger {
            border-color: var(--border-accent);
            background: rgba(255, 255, 255, 0.9);
        }
        .chip-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent) 0%, #374151 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 700; color: var(--bg-primary);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(17, 24, 39, 0.25);
            transition: box-shadow 0.3s ease;
        }
        .user-chip-trigger:hover .chip-avatar {
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.4);
        }
        .chip-name {
            font-family: var(--font-body); font-size: 0.84rem; font-weight: 600;
            color: var(--text-primary); letter-spacing: 0.01em;
            max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            padding-right: 2px;
        }
        .chip-arrow {
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 0.6rem;
            transition: transform 0.3s ease, color 0.3s ease;
            margin-right: 4px;
        }
        .user-chip.open .chip-arrow {
            transform: rotate(180deg); color: var(--accent);
        }
        /* Online indicator */
        .chip-status {
            position: absolute; bottom: -1px; right: -1px;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--bg-primary);
            z-index: 2;
        }
        .chip-avatar-wrap {
            position: relative; flex-shrink: 0;
        }

        /* Dropdown */
        .user-dropdown {
            position: absolute; top: calc(100% + 10px); right: 0;
            width: 220px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 12px 48px rgba(17,24,39,0.10), 0 0 0 1px rgba(255,255,255,0.03);
            opacity: 0; visibility: hidden;
            transform: translateY(-8px) scale(0.97);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden; z-index: 200;
        }
        .user-chip.open .user-dropdown {
            opacity: 1; visibility: visible;
            transform: translateY(0) scale(1);
        }
        .dropdown-header {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .dropdown-header-name {
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 2px;
        }
        .dropdown-header-role {
            font-size: 0.72rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500;
        }
        .dropdown-menu-list {
            padding: 6px;
        }
        .dropdown-menu-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 9px;
            font-size: 0.84rem; font-weight: 500; color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s ease;
            text-decoration: none; border: none; background: none; width: 100%;
            font-family: var(--font-body);
        }
        .dropdown-menu-item:hover {
            background: var(--accent-glow); color: var(--accent);
        }
        .dropdown-menu-item i {
            width: 16px; text-align: center; font-size: 0.82rem;
        }
        .dropdown-divider {
            height: 1px; background: var(--border-subtle); margin: 2px 12px;
        }
        .dropdown-menu-item.danger { color: var(--danger); }
        .dropdown-menu-item.danger:hover {
            background: rgba(239, 68, 68, 0.1); color: var(--danger);
        }

        .login-buttons-center {
            display: flex; justify-content: center; gap: 14px; margin-top: 8px;
        }

        /* ====== FEATURES ====== */
        .feature-section {
            position: relative; z-index: 5;
            padding: 0 48px 16px;
            animation: fadeSlideUp 0.7s ease 0.15s both;
            flex-shrink: 0;
        }
        .feature-grid {
            max-width: 1080px; margin: 0 auto;
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
        }
        .feature-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 12px; padding: 20px 28px; text-align: center;
            transition: all 0.3s ease; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .feature-card::before {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0;
            height: 2px; background: var(--accent); opacity: 0;
            transition: opacity 0.3s ease;
        }
        .feature-card:hover {
            border-color: var(--border-accent); transform: translateY(-4px);
            box-shadow: 0 8px 32px rgba(17, 24, 39, 0.06);
        }
        .feature-card:hover::before { opacity: 1; }
        .feature-icon {
            font-size: 1.5rem; margin-bottom: 6px;
            animation: float 3s ease-in-out infinite;
        }
        .feature-card:nth-child(2) .feature-icon { animation-delay: 0.5s; }
        .feature-card:nth-child(3) .feature-icon { animation-delay: 1s; }
        .feature-card h3 {
            font-family: var(--font-display); font-size: 1.02rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 4px;
        }
        .feature-card p {
            font-size: 0.82rem; color: var(--text-muted); line-height: 1.5;
        }

        /* ====== LATEST POSTS ====== */
        .posts-section {
            position: relative; z-index: 5;
            padding: 8px 48px 24px;
            animation: fadeSlideUp 0.8s ease 0.25s both;
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .posts-header {
            text-align: center; margin-bottom: 12px;
            flex-shrink: 0;
        }
        .posts-header h2 {
            font-family: var(--font-display); font-size: 1.45rem; font-weight: 800;
            color: var(--text-primary); letter-spacing: -0.01em; margin-bottom: 4px;
        }
        .posts-header .accent-line {
            width: 36px; height: 2px; background: var(--accent);
            margin: 8px auto 0; border-radius: 2px; opacity: 0.4;
        }

        /* Blog cards container - 2x3 六宫格（自适应视口高度） */
        #blogList.row.g-4 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 14px;
            max-width: 1080px; width: 100%;
            margin: 0 auto;
            flex: 1 1 auto;
            min-height: 0;
        }
        #blogList > .col-12 { padding: 0; margin: 0; width: 100%; }

        /* ====== POST CARD (grid) ====== */
        .post-card {
            position: relative;
            background: linear-gradient(180deg, rgba(255,255,255,0.82) 0%, rgba(255,255,255,0.68) 100%);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.04);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s ease;
            overflow: hidden;
            animation: fadeSlideUp 0.5s ease both;
            display: flex;
            min-height: 0;
            min-width: 0;
        }
        /* 顶部墨色条（hover 显现） */
        .post-card::before {
            content: ''; position: absolute; left: 14%; right: 14%; top: 0;
            height: 3px; border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, var(--accent), #4b5563);
            opacity: 0; transform: scaleX(0.4); transform-origin: center;
            transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        /* 右上角淡墨装饰 */
        .post-card::after {
            content: ''; position: absolute; top: -40px; right: -40px;
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle at center, rgba(17,24,39,0.05), transparent 70%);
            opacity: 0; transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .post-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-accent);
            box-shadow: 0 14px 40px rgba(17, 24, 39, 0.08), 0 2px 6px rgba(17,24,39,0.04);
        }
        .post-card:hover::before { opacity: 1; transform: scaleX(1); }
        .post-card:hover::after  { opacity: 1; }

        .post-card-link {
            flex: 1;
            display: flex; flex-direction: column;
            padding: 18px 20px;
            text-decoration: none; color: inherit;
            position: relative; z-index: 1;
            min-width: 0;
        }

        /* 顶部：徽章 + 浏览数 */
        .post-card-head {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }

        /* 字母徽章（缩小版） */
        .post-badge {
            flex-shrink: 0;
            width: 44px; height: 44px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display);
            font-size: 1.2rem; font-weight: 800;
            color: #f9fafb;
            background: linear-gradient(135deg, #111827 0%, #374151 55%, #6b7280 100%);
            box-shadow: 0 6px 18px rgba(17, 24, 39, 0.22),
                        inset 0 1px 0 rgba(255,255,255,0.15);
            letter-spacing: -0.02em;
            transition: transform 0.4s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s ease;
            position: relative;
        }
        .post-badge::after {
            content: ''; position: absolute; inset: 0; border-radius: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 50%);
            pointer-events: none;
        }
        .post-card:hover .post-badge {
            transform: rotate(-4deg) scale(1.06);
            box-shadow: 0 10px 24px rgba(17, 24, 39, 0.28);
        }

        .post-title {
            font-family: var(--font-display);
            font-size: 1.05rem; font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4; letter-spacing: -0.01em;
            margin: 0 0 6px;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
            transition: color 0.25s ease;
        }
        .post-card:hover .post-title { color: var(--accent); }

        .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.84rem; line-height: 1.55;
            margin: 0 0 12px;
            flex: 1;
            display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .post-foot {
            display: flex; align-items: center; justify-content: space-between;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-subtle);
            margin-top: auto;
        }
        .post-meta {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.72rem; color: var(--text-muted);
            font-weight: 500;
            min-width: 0; flex: 1;
        }
        .post-meta-item {
            display: inline-flex; align-items: center; gap: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            min-width: 0;
        }
        .post-meta-item:first-child { flex-shrink: 1; }
        .post-meta-item i {
            font-size: 0.78rem; color: var(--text-muted); opacity: 0.85;
            flex-shrink: 0;
        }
        .post-meta-dot {
            width: 3px; height: 3px; border-radius: 50%;
            background: var(--border-accent); flex-shrink: 0;
        }

        .post-views {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.74rem; color: var(--text-muted); font-weight: 500;
            background: rgba(17, 24, 39, 0.04);
            padding: 3px 8px; border-radius: 999px;
        }
        .post-views i { font-size: 0.78rem; opacity: 0.8; }

        .post-cta {
            flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 50%;
            background: rgba(17, 24, 39, 0.06);
            color: var(--accent);
            transition: background 0.3s ease, color 0.3s ease, transform 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .post-cta i { font-size: 0.72rem; transition: transform 0.35s cubic-bezier(0.4,0,0.2,1); }
        .post-card:hover .post-cta {
            background: var(--accent); color: #fff; transform: translateX(2px);
        }
        .post-card:hover .post-cta i { transform: translateX(2px); }

        /* ====== 占位卡（不足 9 个时填充） ====== */
        .post-card--placeholder {
            background: repeating-linear-gradient(
                45deg,
                rgba(255,255,255,0.35),
                rgba(255,255,255,0.35) 10px,
                rgba(243, 244, 246, 0.55) 10px,
                rgba(243, 244, 246, 0.55) 20px
            );
            border: 1px dashed var(--border-subtle);
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }
        .post-card--placeholder::before,
        .post-card--placeholder::after { display: none; }
        .post-card--placeholder:hover {
            transform: none;
            border-color: var(--border-subtle);
            box-shadow: none;
        }
        .placeholder-inner {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
        }
        .placeholder-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--border-accent);
            opacity: 0.5;
            animation: placeholderPulse 1.6s ease-in-out infinite;
        }
        .placeholder-dot:nth-child(2) { animation-delay: 0.2s; }
        .placeholder-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes placeholderPulse {
            0%, 100% { opacity: 0.25; transform: scale(0.85); }
            50%      { opacity: 0.7;  transform: scale(1.1); }
        }

        /* Loading / empty / error states */
        .blog-loading, .blog-empty, .blog-error {
            padding: 36px 0; text-align: center;
        }
        .blog-empty h3, .blog-error h3 {
            font-family: var(--font-display); color: var(--text-primary);
            margin-bottom: 8px;
        }
        .blog-empty p, .blog-error p { color: var(--text-muted); }
        .blog-error .btn-outline-primary {
            background: transparent; color: var(--accent);
            border: 1.5px solid var(--border-accent); border-radius: 8px;
            padding: 8px 20px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; margin-top: 12px;
        }
        .blog-error .btn-outline-primary:hover {
            background: var(--accent); color: var(--bg-primary);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

        @media (max-width: 1024px) {
            .hero-section { padding: 28px 28px 14px; }
            .feature-section { padding: 0 28px 14px; }
            .posts-section { padding: 6px 28px 20px; }
            #blogList.row.g-4 { gap: 12px; }
            .post-card-link { padding: 14px 16px; }
            .post-badge { width: 38px; height: 38px; font-size: 1.05rem; border-radius: 11px; }
            .post-title { font-size: 0.98rem; }
        }
        @media (max-width: 768px) {
            /* 中等屏幕：不强行锁定视口高度，改为允许纵向滚动 */
            html, body { overflow: auto; overflow-x: hidden; }
            body { height: auto; max-height: none; min-height: 100vh; }
            .posts-section { flex: none; }
            #blogList.row.g-4 { flex: none; }
            .hero-section { padding: 36px 18px 20px; }
            .hero-section h1 { font-size: 1.9rem; }
            .feature-section { padding: 0 18px 16px; }
            .feature-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .feature-card { padding: 14px 10px; border-radius: 10px; }
            .feature-icon { font-size: 1.3rem; margin-bottom: 4px; }
            .feature-card h3 { font-size: 0.92rem; }
            .feature-card p { font-size: 0.74rem; line-height: 1.4; }
            .posts-section { padding: 14px 14px 32px; }
            .posts-header { margin-bottom: 14px; }
            .posts-header h2 { font-size: 1.2rem; }
            /* 两列 × 三行 */
            #blogList.row.g-4 {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, minmax(160px, auto));
                gap: 12px;
            }
            .post-card-link { padding: 14px 16px; }
            .post-badge { width: 38px; height: 38px; font-size: 1rem; border-radius: 10px; }
            .post-title { font-size: 0.98rem; }
            .post-excerpt { font-size: 0.8rem; }
            .post-meta { font-size: 0.68rem; gap: 6px; }
            .post-foot { padding-top: 8px; }
            .user-info-wrapper { top: 12px; right: 12px; }
        }
        @media (max-width: 480px) {
            .hero-section h1 { font-size: 1.6rem; }
            .hero-actions { flex-direction: column; align-items: center; }
            .btn-hero { width: 100%; max-width: 260px; justify-content: center; }
            .feature-grid { grid-template-columns: 1fr; gap: 8px; }
            .feature-card { padding: 14px 16px; }
            /* 单列布局 */
            #blogList.row.g-4 {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, minmax(140px, auto));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- User Info (top-right corner) -->
    <div class="user-info-wrapper">
        <div id="user-info-container" style="display: none;"></div>
    </div>

    <!-- Hero Section -->
    <section class="hero-section">
        <h1>欢迎来到<br>我的博<span>客</span></h1>
        <p class="hero-subtitle">Share knowledge · Record growth · Explore infinite</p>
        <div class="hero-divider"></div>

        <div class="hero-actions">
            <!-- Login buttons - shown when not logged in -->
            <div class="login-buttons-center" style="display: none;">
                <a href="/login" class="btn-hero btn-hero-primary">
                    <i class="fas fa-sign-in-alt"></i> 登录
                </a>
                <a href="/sign-in" class="btn-hero btn-hero-ghost">
                    <i class="fas fa-user-plus"></i> 注册
                </a>
            </div>
        </div>
    </section>

    <!-- Features -->
    <section class="feature-section">
        <div class="feature-grid">
            <div class="feature-card" onclick="goToBlogCreate()" style="cursor: pointer;">
                <div class="feature-icon">📝</div>
                <h3>写博客</h3>
                <p>记录你的想法和心得，用文字表达你的思考，分享给更多人</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">📚</div>
                <h3>读博客</h3>
                <p>浏览其他用户的精彩文章，学习新知识，拓展视野</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">💬</div>
                <h3>交流互动</h3>
                <p>与其他用户评论互动，建立社区联系，共同成长</p>
            </div>
        </div>
    </section>

    <!-- Latest Posts -->
    <section class="posts-section">
        <div class="posts-header">
            <h2>📖 最新文章</h2>
            <div class="accent-line"></div>
        </div>

        <div id="blogLoading" class="loading-container" style="display: none;">
            <div class="loading-spinner"></div>
            <p class="loading-text">加载中…</p>
        </div>

        <div id="blogList" class="row g-4">
            <!-- Blog list loaded by JS -->
        </div>

        <div id="blogEmpty" class="blog-empty" style="display: none;">
            <div style="font-size: 4rem; margin-bottom: 20px;">📭</div>
            <h3>暂无文章</h3>
            <p>还没有发布的博客，敬请期待！</p>
        </div>

        <div id="blogError" class="blog-error" style="display: none;">
            <div style="font-size: 4rem; margin-bottom: 20px;">⚠️</div>
            <h3>加载失败</h3>
            <p id="blogErrorMsg">加载博客列表失败，请稍后重试</p>
            <button class="btn btn-outline-primary" onclick="loadLatestBlogs()">重新加载</button>
        </div>
    </section>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
