<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客详情 - 我的博客</title>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/custom.css" rel="stylesheet">
    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/playfair-display/index.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/dm-sans/index.css" rel="stylesheet">
    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; overflow-x: hidden; }
        body {
            min-height: 100vh;
            background: var(--bg-primary);
            font-family: var(--font-body);
            color: var(--text-primary);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(232, 180, 76, 0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(88, 101, 242, 0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat; pointer-events: none; z-index: 0;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            position: relative; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            animation: fadeSlideDown 0.5s ease both;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.88rem; font-weight: 500; letter-spacing: 0.02em;
            padding: 6px 14px; border-radius: 8px; border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: var(--accent); border-color: var(--border-accent);
            background: var(--accent-glow); transform: translateX(-3px);
        }
        .back-link svg { transition: transform 0.3s ease; }
        .back-link:hover svg { transform: translateX(-3px); }
        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.03em;
        }
        .status-draft {
            background: rgba(232, 180, 76, 0.12); color: var(--accent);
            border: 1px solid rgba(232, 180, 76, 0.2);
        }
        .status-published {
            background: rgba(93, 204, 143, 0.12); color: var(--success);
            border: 1px solid rgba(93, 204, 143, 0.2);
        }

        .article-section {
            position: relative; z-index: 5;
            max-width: 820px; margin: 0 auto;
            padding: 48px 28px 60px;
            animation: fadeSlideUp 0.6s ease 0.1s both;
        }

        .page-loading {
            position: relative; z-index: 5;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 80px 0; min-height: 400px;
            animation: fadeSlideUp 0.5s ease both;
        }
        .page-loading .loading-spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(232, 180, 76, 0.12);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 18px;
        }
        .page-loading .loading-text {
            font-size: 0.95rem; color: var(--text-muted); font-weight: 500;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .article-title {
            font-family: var(--font-display); font-size: 2.4rem; font-weight: 800;
            color: var(--text-primary); letter-spacing: -0.02em; line-height: 1.25;
            margin-bottom: 24px;
        }

        .article-meta {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 20px 24px; margin-bottom: 32px;
        }
        .meta-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }
        .meta-item { display: flex; align-items: center; gap: 10px; }
        .meta-icon {
            width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
            background: var(--bg-elevated); border-radius: 8px; font-size: 1rem;
            border: 1px solid var(--border-subtle);
        }
        .meta-label {
            font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .meta-value { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); }
        .blog-tags { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-subtle); }
        .blog-tag {
            display: inline-block;
            background: var(--accent-glow); color: var(--accent);
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 600;
            border: 1px solid rgba(232, 180, 76, 0.15);
            margin-right: 6px; margin-bottom: 6px;
        }

        /* Blog content - same as blog-view */
        .blog-content {
            color: var(--text-secondary); line-height: 1.85; font-size: 1.05rem;
            word-wrap: break-word; word-break: break-word;
        }
        .blog-content h1 {
            font-family: var(--font-display); font-size: 2em; font-weight: 700;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.3em;
            margin: 1.5em 0 0.6em;
        }
        .blog-content h2 {
            font-family: var(--font-display); font-size: 1.5em; font-weight: 700;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.2em;
            margin: 1.3em 0 0.5em;
        }
        .blog-content h3 {
            font-family: var(--font-display); font-size: 1.25em; font-weight: 700;
            color: var(--text-primary); margin: 1.2em 0 0.5em;
        }
        .blog-content p { margin-bottom: 1.3em; }
        .blog-content code {
            background: var(--accent-glow); padding: 2px 7px; border-radius: 5px;
            font-family: 'SFMono-Regular', 'Consolas', monospace;
            color: var(--accent); font-size: 0.9em;
            border: 1px solid rgba(232, 180, 76, 0.15);
        }
        .blog-content pre {
            background: var(--bg-elevated); padding: 20px; border-radius: 12px;
            overflow-x: auto; margin-bottom: 1.5em; border: 1px solid var(--border-subtle);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.15);
        }
        .blog-content pre code {
            background: none; padding: 0; color: var(--text-primary); border: none; font-size: 0.92em;
        }
        .blog-content blockquote {
            border-left: 3px solid var(--accent); padding: 16px 20px;
            margin: 1.5em 0; border-radius: 0 10px 10px 0;
            background: var(--accent-glow); color: var(--text-secondary); font-style: italic;
        }
        .blog-content ul, .blog-content ol { padding-left: 2em; margin-bottom: 1.3em; }
        .blog-content li { margin-bottom: 0.5em; }
        .blog-content li::marker { color: var(--accent); }
        .blog-content img {
            max-width: 100%; height: auto; border-radius: 12px;
            margin: 1.5em 0; border: 1px solid var(--border-subtle);
        }
        .blog-content table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            margin-bottom: 1.5em; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border-subtle);
        }
        .blog-content th {
            background: var(--bg-elevated); color: var(--text-primary);
            font-weight: 700; padding: 10px 14px; text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }
        .blog-content td { padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); }
        .blog-content a {
            color: var(--accent); text-decoration: none; font-weight: 600;
            border-bottom: 1px solid rgba(232, 180, 76, 0.3); transition: all 0.2s ease;
        }
        .blog-content a:hover { color: var(--accent-hover); border-bottom-color: var(--accent-hover); }

        .action-buttons {
            display: flex; gap: 12px; justify-content: center;
            margin-top: 48px; padding-top: 32px;
            border-top: 1px solid var(--border-subtle);
        }
        .btn-action {
            padding: 10px 24px; border-radius: 10px; font-weight: 600;
            font-size: 0.88rem; transition: all 0.3s ease;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
            border: 1px solid var(--border-subtle);
        }
        .btn-back {
            background: var(--bg-elevated); color: var(--text-secondary);
        }
        .btn-back:hover {
            background: var(--bg-secondary); color: var(--text-primary);
            transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

        @media (max-width: 768px) {
            .top-bar { padding: 12px 16px; }
            .article-section { padding: 32px 16px 40px; }
            .article-title { font-size: 1.8rem; }
            .meta-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .action-buttons { flex-direction: column; align-items: stretch; }
            .btn-action { justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="top-bar">
        <a href="/" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
            </svg>
            返回首页
        </a>
        <div>
            <span id="statusBadge" class="status-badge">-</span>
        </div>
        <div></div>
    </nav>

    <!-- Loading -->
    <div id="loading" class="page-loading">
        <div class="loading-spinner"></div>
        <p class="loading-text">加载博客内容中…</p>
    </div>

    <!-- Article -->
    <article class="article-section" id="blogContentContainer" style="display: none;">
        <h1 class="article-title" id="blogTitle">-</h1>

        <div class="article-meta">
            <div class="meta-grid">
                <div class="meta-item">
                    <div class="meta-icon">👤</div>
                    <div>
                        <div class="meta-label">作者</div>
                        <div class="meta-value" id="authorName">-</div>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">📅</div>
                    <div>
                        <div class="meta-label">创建时间</div>
                        <div class="meta-value" id="createdAt">-</div>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">📝</div>
                    <div>
                        <div class="meta-label">更新时间</div>
                        <div class="meta-value" id="updatedAt">-</div>
                    </div>
                </div>
                <div class="meta-item">
                    <div class="meta-icon">👁️</div>
                    <div>
                        <div class="meta-label">浏览数</div>
                        <div class="meta-value" id="viewCount">-</div>
                    </div>
                </div>
            </div>

            <div id="categoryContainer" class="mt-3" style="display: none;">
                <div class="meta-item">
                    <div class="meta-icon">📁</div>
                    <div>
                        <div class="meta-label">分类</div>
                        <div class="meta-value" id="category">-</div>
                    </div>
                </div>
            </div>

            <div id="tagsContainer" class="blog-tags" style="display: none;">
                <div id="tags"></div>
            </div>
        </div>

        <div class="blog-content" id="blogContent">-</div>

        <div class="action-buttons">
            <button class="btn btn-action btn-back" onclick="goBack()">
                <i class="fas fa-arrow-left"></i> 返回首页
            </button>
        </div>
    </article>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/blog-public-view.js"></script>
</body>
</html>
