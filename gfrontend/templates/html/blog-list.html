<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客 - 博客列表</title>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/custom.css" rel="stylesheet">
    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/playfair-display/index.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/dm-sans/index.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; overflow-x: hidden; }
        body {
            min-height: 100vh;
            background: var(--bg-primary);
            font-family: var(--font-body);
            color: var(--text-primary);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(17, 24, 39, 0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(148, 163, 184, 0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat; pointer-events: none; z-index: 0;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes accentPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* TOP BAR */
        .top-bar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            animation: fadeSlideDown 0.5s ease both;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.88rem; font-weight: 500; letter-spacing: 0.02em;
            padding: 6px 14px; border-radius: 8px; border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: var(--accent); border-color: var(--border-accent);
            background: var(--accent-glow); transform: translateX(-3px);
        }
        .back-link svg { transition: transform 0.3s ease; }
        .back-link:hover svg { transform: translateX(-3px); }
        .page-badge {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.95rem; font-weight: 600;
            color: var(--text-secondary); letter-spacing: 0.03em;
        }
        .page-badge .dot {
            width: 6px; height: 6px; background: var(--accent);
            border-radius: 50%; animation: accentPulse 2.5s ease-in-out infinite;
        }
        .btn-create-top {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 22px; background: var(--accent); color: var(--bg-primary);
            font-family: var(--font-body); font-size: 0.88rem; font-weight: 700;
            letter-spacing: 0.04em; border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.2);
            position: relative; overflow: hidden; text-decoration: none;
        }
        .btn-create-top::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            transition: left 0.5s;
        }
        .btn-create-top:hover {
            background: var(--accent-hover); color: var(--bg-primary);
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.35); transform: translateY(-2px);
        }
        .btn-create-top:hover::before { left: 100%; }

        /* HERO */
        .title-hero {
            position: relative; z-index: 5;
            padding: 48px 32px 32px; text-align: center;
            animation: fadeSlideUp 0.6s ease 0.1s both;
        }
        .title-hero h1 {
            font-family: var(--font-display); font-size: 2.6rem; font-weight: 800;
            color: var(--text-primary); letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 10px;
        }
        .title-hero h1 span {
            background: linear-gradient(135deg, var(--accent) 0%, #374151 50%, var(--accent) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: shimmer 4s linear infinite;
        }
        .title-hero .subtitle {
            font-size: 0.95rem; color: var(--text-muted); font-weight: 400;
            letter-spacing: 0.08em; text-transform: uppercase;
        }
        .title-hero .divider {
            width: 48px; height: 2px; background: var(--accent);
            margin: 18px auto 0; border-radius: 2px; opacity: 0.5;
        }

        /* BLOG LIST */
        .list-section {
            position: relative; z-index: 5;
            max-width: 900px; margin: 0 auto;
            padding: 0 28px 60px;
            animation: fadeSlideUp 0.7s ease 0.2s both;
        }

        .blog-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 24px 28px;
            margin-bottom: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.05);
            position: relative; overflow: hidden;
        }
        .blog-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--accent); opacity: 0;
            transition: opacity 0.3s ease;
        }
        .blog-card:hover {
            border-color: var(--border-accent);
            box-shadow: 0 8px 32px rgba(17, 24, 39, 0.06);
            transform: translateY(-3px);
        }
        .blog-card:hover::before { opacity: 1; }

        .blog-card-title {
            font-family: var(--font-display); font-size: 1.25rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 10px; line-height: 1.4;
        }
        .blog-card-meta {
            color: var(--text-muted); font-size: 0.82rem; margin-bottom: 12px;
            display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
        }
        .blog-card-meta span { display: inline-flex; align-items: center; gap: 5px; }
        .blog-card-content {
            color: var(--text-secondary); margin-bottom: 16px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
            line-height: 1.7; font-size: 0.92rem;
        }
        .blog-card-tags { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
        .blog-tag {
            display: inline-block;
            background: var(--accent-glow); color: var(--accent);
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em;
            border: 1px solid rgba(17, 24, 39, 0.15);
        }
        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.03em;
        }
        .status-draft {
            background: rgba(17, 24, 39, 0.12); color: var(--accent);
            border: 1px solid rgba(17, 24, 39, 0.2);
        }
        .status-published {
            background: rgba(16, 185, 129, 0.12); color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .blog-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action {
            padding: 7px 16px; border-radius: 8px;
            font-size: 0.82rem; font-weight: 600;
            transition: all 0.3s ease; border: 1px solid var(--border-subtle);
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            letter-spacing: 0.02em;
        }
        .btn-edit {
            background: var(--bg-elevated); color: var(--text-secondary); border-color: var(--border-subtle);
        }
        .btn-edit:hover {
            background: var(--accent-glow); color: var(--accent); border-color: var(--border-accent);
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(17,24,39,0.05);
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.08); color: var(--danger);
            border-color: rgba(239, 68, 68, 0.15);
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(17,24,39,0.05);
        }
        .btn-publish {
            background: rgba(16, 185, 129, 0.08); color: var(--success);
            border-color: rgba(16, 185, 129, 0.15);
        }
        .btn-publish:hover {
            background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3);
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(17,24,39,0.05);
        }
        .btn-view {
            background: var(--bg-elevated); color: var(--text-secondary); border-color: var(--border-subtle);
        }
        .btn-view:hover {
            background: var(--accent-glow); color: var(--accent); border-color: var(--border-accent);
            transform: translateY(-2px); box-shadow: 0 4px 12px rgba(17,24,39,0.05);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center; padding: 80px 20px;
            animation: fadeSlideUp 0.6s ease 0.3s both;
        }
        .empty-state-icon {
            font-size: 4rem; margin-bottom: 20px; filter: grayscale(30%);
        }
        .empty-state h3 {
            font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 8px;
        }
        .empty-state p {
            color: var(--text-muted); font-size: 0.95rem;
        }

        /* PAGINATION */
        .pagination-container {
            display: flex; justify-content: center;
            margin-top: 32px; gap: 8px;
        }
        .pagination-container .page-link {
            background: var(--bg-elevated); border: 1px solid var(--border-subtle);
            color: var(--text-secondary); border-radius: 8px; padding: 8px 14px;
            font-size: 0.88rem; transition: all 0.3s ease;
        }
        .pagination-container .page-link:hover,
        .pagination-container .page-link.active {
            background: var(--accent); color: var(--bg-primary);
            border-color: var(--accent);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

        @media (max-width: 768px) {
            .top-bar { padding: 12px 16px; }
            .page-badge { display: none; }
            .title-hero { padding: 32px 20px 24px; }
            .title-hero h1 { font-size: 1.9rem; }
            .list-section { padding: 0 12px 40px; }
            .blog-card { padding: 18px 20px; border-radius: 12px; }
            .blog-card-title { font-size: 1.1rem; }
            .blog-actions { gap: 6px; }
            .btn-action { padding: 6px 12px; font-size: 0.78rem; }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="top-bar">
        <a href="/" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
            </svg>
            返回首页
        </a>
        <div class="page-badge">
            <span class="dot"></span>
            My Posts
        </div>
        <button class="btn-create-top" onclick="createBlog()">
            <i class="fas fa-feather-alt"></i>
            创建文章
        </button>
    </nav>

    <!-- Hero -->
    <section class="title-hero">
        <h1>我的博<span>客</span></h1>
        <p class="subtitle">Manage your stories</p>
        <div class="divider"></div>
    </section>

    <!-- Blog List -->
    <section class="list-section">
        <div id="blogList">
            <!-- Blog cards loaded by JS -->
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📝</div>
            <h3>还没有博客</h3>
            <p>点击上方的"创建文章"按钮开始您的创作之旅吧！</p>
        </div>

        <div class="pagination-container" id="pagination">
            <!-- Pagination loaded by JS -->
        </div>
    </section>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/blog-list.js"></script>
</body>
</html>
