<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 我的博客</title>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/custom.css" rel="stylesheet">
    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/playfair-display/index.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/dm-sans/index.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; overflow-x: hidden; }
        body {
            min-height: 100vh;
            background: var(--bg-primary);
            font-family: var(--font-body);
            color: var(--text-primary);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(17, 24, 39, 0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(148, 163, 184, 0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat; pointer-events: none; z-index: 0;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .register-wrapper {
            position: relative; z-index: 5;
            width: 100%; max-width: 420px; padding: 40px 24px;
            animation: fadeSlideUp 0.6s ease both;
        }

        .register-header {
            text-align: center; margin-bottom: 36px;
        }
        .register-header h1 {
            font-family: var(--font-display); font-size: 2.2rem; font-weight: 800;
            color: var(--text-primary); letter-spacing: -0.02em; margin-bottom: 8px;
        }
        .register-header h1 span {
            background: linear-gradient(135deg, var(--accent) 0%, #374151 50%, var(--accent) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; animation: shimmer 4s linear infinite;
        }
        .register-header p {
            color: var(--text-muted); font-size: 0.92rem; letter-spacing: 0.02em;
        }
        .register-header .divider {
            width: 40px; height: 2px; background: var(--accent);
            margin: 16px auto 0; border-radius: 2px; opacity: 0.5;
        }

        .register-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: 18px; padding: 36px 32px;
            box-shadow: 0 8px 40px rgba(17, 24, 39, 0.06), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
        }

        .form-group { margin-bottom: 20px; position: relative; }
        .form-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.1em; margin-bottom: 8px;
        }
        .form-group .form-control {
            width: 100%; background: var(--bg-elevated);
            border: 1.5px solid var(--border-subtle); border-radius: 10px;
            padding: 13px 16px; font-family: var(--font-body);
            font-size: 0.95rem; color: var(--text-primary);
            transition: all 0.3s ease; height: auto;
        }
        .form-group .form-control::placeholder { color: var(--text-muted); }
        .form-group .form-control:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow); background: var(--bg-secondary);
        }

        #registerMessage {
            text-align: center; margin-bottom: 16px;
            font-size: 0.88rem; font-weight: 500;
        }

        .btn-register {
            width: 100%; padding: 13px; background: var(--accent);
            color: var(--bg-primary); border: none; border-radius: 10px;
            font-family: var(--font-body); font-size: 0.95rem; font-weight: 700;
            letter-spacing: 0.04em; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.2);
            position: relative; overflow: hidden;
        }
        .btn-register::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            transition: left 0.5s;
        }
        .btn-register:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.35); transform: translateY(-2px);
        }
        .btn-register:hover::before { left: 100%; }
        .btn-register:active { transform: translateY(0); }

        .login-link {
            text-align: center; margin-top: 24px;
            font-size: 0.88rem; color: var(--text-muted);
        }
        .login-link a {
            color: var(--accent); text-decoration: none; font-weight: 600;
            transition: color 0.2s ease;
        }
        .login-link a:hover { color: var(--accent-hover); }

        .back-home {
            text-align: center; margin-top: 16px;
        }
        .back-home a {
            color: var(--text-muted); text-decoration: none; font-size: 0.82rem;
            display: inline-flex; align-items: center; gap: 6px;
            transition: color 0.2s ease;
        }
        .back-home a:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <!-- Header -->
        <div class="register-header">
            <h1>加入<span>我们</span></h1>
            <p>创建账户，开启你的博客之旅</p>
            <div class="divider"></div>
        </div>

        <!-- Register Card -->
        <div class="register-card">
            <form>
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" class="form-control" id="reg-username" placeholder="请输入用户名" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">邮箱地址</label>
                    <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-phone">手机号码</label>
                    <input type="tel" class="form-control" id="reg-phone" placeholder="13800138000" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input type="password" class="form-control" id="reg-password" placeholder="请设置密码" required>
                </div>

                <div id="registerMessage" role="status" aria-live="polite"></div>

                <button class="btn-register" type="button" onclick="registerUser(event)">
                    立即注册
                </button>
            </form>

            <div class="login-link">
                已有账户？<a href="/login">立即登录</a>
            </div>
        </div>

        <div class="back-home">
            <a href="/"><i class="fas fa-arrow-left"></i> 返回首页</a>
        </div>
    </div>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/sign-in.js"></script>
</body>
</html>
