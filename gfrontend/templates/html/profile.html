<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 我的博客</title>
    <link href="../assets/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/custom.css" rel="stylesheet">
    <link href="../node_modules/@fortawesome/fontawesome-free/css/all.min.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/playfair-display/index.css" rel="stylesheet">
    <link href="../node_modules/@fontsource/dm-sans/index.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; overflow-x: hidden; }
        body {
            min-height: 100vh;
            background: var(--bg-primary);
            font-family: var(--font-body);
            color: var(--text-primary);
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(17, 24, 39, 0.06), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(148, 163, 184, 0.04), transparent);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-repeat: repeat; pointer-events: none; z-index: 0;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeSlideRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes accentPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        @keyframes avatarGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(17, 24, 39, 0.1); }
            50% { box-shadow: 0 0 30px rgba(17, 24, 39, 0.25); }
        }
        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* TOP BAR */
        .top-bar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 28px;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            animation: fadeSlideDown 0.5s ease both;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-secondary); text-decoration: none;
            font-size: 0.88rem; font-weight: 500; letter-spacing: 0.02em;
            padding: 6px 14px; border-radius: 8px; border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            color: var(--accent); border-color: var(--border-accent);
            background: var(--accent-glow); transform: translateX(-3px);
        }
        .back-link svg { transition: transform 0.3s ease; }
        .back-link:hover svg { transform: translateX(-3px); }
        .page-badge {
            display: flex; align-items: center; gap: 8px;
            font-family: var(--font-display); font-size: 0.95rem; font-weight: 600;
            color: var(--text-secondary); letter-spacing: 0.03em;
        }
        .page-badge .dot {
            width: 6px; height: 6px; background: var(--accent);
            border-radius: 50%; animation: accentPulse 2.5s ease-in-out infinite;
        }
        .btn-create-top {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 22px; background: var(--accent); color: var(--bg-primary);
            font-family: var(--font-body); font-size: 0.88rem; font-weight: 700;
            letter-spacing: 0.04em; border: none; border-radius: 8px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.2);
            position: relative; overflow: hidden; text-decoration: none;
        }
        .btn-create-top::before {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
            transition: left 0.5s;
        }
        .btn-create-top:hover {
            background: var(--accent-hover); color: var(--bg-primary);
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.35); transform: translateY(-2px);
        }
        .btn-create-top:hover::before { left: 100%; }

        /* MAIN LAYOUT */
        .profile-layout {
            position: relative; z-index: 5;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 0;
            min-height: calc(100vh - 57px);
        }

        /* SIDEBAR */
        .profile-sidebar {
            border-right: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.5);
            padding: 36px 24px;
            animation: fadeSlideLeft 0.6s ease 0.1s both;
            position: sticky; top: 57px;
            height: calc(100vh - 57px);
            overflow-y: auto;
        }

        .user-avatar-wrapper {
            text-align: center; margin-bottom: 24px;
        }
        .user-avatar {
            width: 88px; height: 88px; border-radius: 20px;
            background: var(--bg-elevated); border: 2px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.4rem; margin: 0 auto 14px;
            transition: all 0.4s ease;
            animation: avatarGlow 3s ease-in-out infinite;
        }
        .user-avatar:hover {
            border-color: var(--accent);
            transform: scale(1.05) rotate(2deg);
        }
        .user-name {
            font-family: var(--font-display); font-size: 1.5rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 4px;
        }
        .user-role {
            font-size: 0.8rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500;
        }

        /* STATS */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin: 24px 0;
        }
        .stat-item {
            text-align: center; padding: 14px 8px;
            background: var(--bg-elevated); border-radius: 12px;
            border: 1px solid var(--border-subtle);
            transition: all 0.3s ease;
        }
        .stat-item:hover {
            border-color: var(--border-accent);
            transform: translateY(-2px);
        }
        .stat-number {
            font-family: var(--font-display); font-size: 1.4rem; font-weight: 800;
            color: var(--accent);
            animation: countUp 0.5s ease 0.4s both;
        }
        .stat-label {
            font-size: 0.7rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-top: 2px; font-weight: 600;
        }

        /* USER INFO */
        .user-details {
            margin: 20px 0;
        }
        .detail-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; margin-bottom: 6px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }
        .detail-item:hover {
            background: var(--bg-elevated);
        }
        .detail-icon {
            width: 32px; height: 32px; border-radius: 8px;
            background: var(--bg-elevated); border: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent); font-size: 0.82rem;
            flex-shrink: 0;
        }
        .detail-item:hover .detail-icon {
            border-color: var(--border-accent);
            background: var(--accent-glow);
        }
        .detail-text {
            flex: 1; min-width: 0;
        }
        .detail-label {
            font-size: 0.7rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
        }
        .detail-value {
            font-size: 0.88rem; color: var(--text-primary); font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* SIDEBAR ACTIONS */
        .sidebar-actions {
            margin-top: 24px; padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex; flex-direction: column; gap: 8px;
        }
        .btn-sidebar {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 16px; border-radius: 10px;
            font-family: var(--font-body); font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: all 0.3s ease;
            letter-spacing: 0.02em; border: 1px solid var(--border-subtle);
            width: 100%; text-align: left;
        }
        .btn-sidebar i { width: 16px; text-align: center; }
        .btn-switch {
            background: var(--accent); color: var(--bg-primary); border-color: var(--accent);
        }
        .btn-switch:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(17, 24, 39, 0.25); transform: translateY(-2px);
        }
        .btn-logout {
            background: rgba(239, 68, 68, 0.08); color: var(--danger);
            border-color: rgba(239, 68, 68, 0.15);
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.15);
            transform: translateY(-2px); box-shadow: 0 4px 16px rgba(17,24,39,0.05);
        }

        /* MAIN CONTENT */
        .profile-main {
            padding: 32px 36px 60px;
            animation: fadeSlideRight 0.6s ease 0.2s both;
            overflow-y: auto;
        }

        /* SECTION HEADER */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px;
        }
        .section-title {
            font-family: var(--font-display); font-size: 1.6rem; font-weight: 800;
            color: var(--text-primary); letter-spacing: -0.01em;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title .title-accent {
            background: linear-gradient(135deg, var(--accent) 0%, #374151 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .section-title::before {
            content: '';
            width: 4px; height: 24px; background: var(--accent);
            border-radius: 2px; flex-shrink: 0;
        }

        /* FILTER TABS */
        .filter-tabs {
            display: flex; gap: 6px; margin-bottom: 24px;
        }
        .filter-tab {
            padding: 8px 18px; border-radius: 8px;
            font-size: 0.84rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
            border: 1px solid var(--border-subtle);
            background: transparent; color: var(--text-secondary);
            letter-spacing: 0.02em;
        }
        .filter-tab:hover {
            border-color: var(--border-accent);
            color: var(--accent); background: var(--accent-glow);
        }
        .filter-tab.active {
            background: var(--accent); color: var(--bg-primary);
            border-color: var(--accent);
        }
        .filter-tab .tab-count {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 20px; height: 20px; padding: 0 6px;
            border-radius: 10px; font-size: 0.72rem; font-weight: 700;
            margin-left: 6px;
            background: rgba(255,255,255,0.15);
        }
        .filter-tab.active .tab-count {
            background: rgba(255, 255, 255, 0.25);
        }

        /* BLOG CARDS */
        .blog-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 14px; padding: 22px 24px;
            margin-bottom: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 12px rgba(17, 24, 39, 0.05);
            position: relative; overflow: hidden;
        }
        .blog-card::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--accent); opacity: 0;
            transition: opacity 0.3s ease;
        }
        .blog-card:hover {
            border-color: var(--border-accent);
            box-shadow: 0 8px 32px rgba(17, 24, 39, 0.06);
            transform: translateY(-3px);
        }
        .blog-card:hover::before { opacity: 1; }

        .blog-card-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px; gap: 12px;
        }
        .blog-card-title {
            font-family: var(--font-display); font-size: 1.15rem; font-weight: 700;
            color: var(--text-primary); line-height: 1.4;
            flex: 1; cursor: pointer;
            transition: color 0.3s ease;
        }
        .blog-card-title:hover { color: var(--accent); }

        .status-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 20px;
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.03em;
            flex-shrink: 0;
        }
        .status-draft {
            background: rgba(17, 24, 39, 0.12); color: var(--accent);
            border: 1px solid rgba(17, 24, 39, 0.2);
        }
        .status-published {
            background: rgba(16, 185, 129, 0.12); color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .blog-card-meta {
            color: var(--text-muted); font-size: 0.8rem; margin-bottom: 10px;
            display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
        }
        .blog-card-meta span { display: inline-flex; align-items: center; gap: 5px; }
        .blog-card-meta i { font-size: 0.75rem; }

        .blog-card-content {
            color: var(--text-secondary); margin-bottom: 14px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
            line-height: 1.65; font-size: 0.9rem;
        }

        .blog-card-tags { margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
        .blog-tag {
            display: inline-block;
            background: var(--accent-glow); color: var(--accent);
            padding: 3px 10px; border-radius: 20px;
            font-size: 0.74rem; font-weight: 600; letter-spacing: 0.02em;
            border: 1px solid rgba(17, 24, 39, 0.15);
        }

        .blog-card-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px solid var(--border-subtle);
        }
        .blog-card-stats {
            display: flex; gap: 16px;
        }
        .blog-stat {
            display: flex; align-items: center; gap: 5px;
            font-size: 0.78rem; color: var(--text-muted);
        }
        .blog-stat i { font-size: 0.75rem; }

        .blog-actions { display: flex; gap: 6px; }
        .btn-action {
            padding: 6px 14px; border-radius: 8px;
            font-size: 0.8rem; font-weight: 600;
            transition: all 0.3s ease; border: 1px solid var(--border-subtle);
            cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            letter-spacing: 0.02em; background: var(--bg-elevated); color: var(--text-secondary);
        }
        .btn-action:hover {
            transform: translateY(-1px); box-shadow: 0 4px 12px rgba(17,24,39,0.05);
        }
        .btn-view:hover {
            background: var(--accent-glow); color: var(--accent); border-color: var(--border-accent);
        }
        .btn-edit:hover {
            background: var(--accent-glow); color: var(--accent); border-color: var(--border-accent);
        }
        .btn-publish {
            background: rgba(16, 185, 129, 0.08); color: var(--success);
            border-color: rgba(16, 185, 129, 0.15);
        }
        .btn-publish:hover {
            background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3);
        }
        .btn-delete {
            background: rgba(239, 68, 68, 0.08); color: var(--danger);
            border-color: rgba(239, 68, 68, 0.15);
        }
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3);
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center; padding: 80px 20px;
        }
        .empty-state-icon {
            font-size: 4rem; margin-bottom: 20px; filter: grayscale(30%);
        }
        .empty-state h3 {
            font-family: var(--font-display); font-size: 1.3rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 8px;
        }
        .empty-state p {
            color: var(--text-muted); font-size: 0.92rem; margin-bottom: 20px;
        }
        .btn-empty-create {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 24px; background: var(--accent); color: var(--bg-primary);
            font-weight: 700; font-size: 0.88rem; border: none; border-radius: 10px;
            cursor: pointer; transition: all 0.3s ease; text-decoration: none;
        }
        .btn-empty-create:hover {
            background: var(--accent-hover); color: var(--bg-primary);
            transform: translateY(-2px); box-shadow: 0 4px 16px rgba(17, 24, 39, 0.3);
        }

        /* LOADING */
        .blog-loading {
            text-align: center; padding: 60px 0;
        }

        /* PAGINATION */
        .pagination-container {
            display: flex; justify-content: center;
            margin-top: 28px; gap: 6px;
        }
        .pagination-container .page-link {
            background: var(--bg-elevated); border: 1px solid var(--border-subtle);
            color: var(--text-secondary); border-radius: 8px; padding: 8px 14px;
            font-size: 0.85rem; transition: all 0.3s ease; cursor: pointer;
            text-decoration: none;
        }
        .pagination-container .page-link:hover,
        .pagination-container .page-item.active .page-link {
            background: var(--accent); color: var(--bg-primary);
            border-color: var(--accent);
        }
        .pagination-container .page-item.disabled .page-link {
            opacity: 0.4; cursor: not-allowed;
        }

        /* MOBILE SIDEBAR TOGGLE */
        .sidebar-toggle {
            display: none;
            position: fixed; bottom: 24px; right: 24px; z-index: 200;
            width: 52px; height: 52px; border-radius: 14px;
            background: var(--accent); color: var(--bg-primary);
            border: none; cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 4px 20px rgba(17, 24, 39, 0.35);
            transition: all 0.3s ease;
        }
        .sidebar-toggle:hover {
            transform: scale(1.05);
        }

        /* MOBILE OVERLAY */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(17,24,39,0.30); z-index: 150;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; }

        /* EDIT NICKNAME */
        .nickname-display {
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-edit-nickname {
            background: none; border: none; cursor: pointer;
            color: var(--text-muted); font-size: 0.85rem;
            padding: 4px 6px; border-radius: 6px;
            transition: all 0.3s ease;
            display: inline-flex; align-items: center;
        }
        .btn-edit-nickname:hover {
            color: var(--accent); background: var(--accent-glow);
        }
        .nickname-edit-form {
            display: none; margin-top: 8px;
            animation: fadeSlideUp 0.3s ease both;
        }
        .nickname-edit-form.active {
            display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .nickname-input {
            width: 100%; padding: 8px 14px;
            background: var(--bg-elevated); border: 1px solid var(--border-subtle);
            border-radius: 8px; color: var(--text-primary);
            font-family: var(--font-body); font-size: 0.9rem;
            outline: none; transition: all 0.3s ease;
            text-align: center;
        }
        .nickname-input:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.1);
        }
        .nickname-edit-actions {
            display: flex; gap: 8px; width: 100%; justify-content: center;
        }
        .btn-nickname-save {
            padding: 6px 18px; border-radius: 8px;
            background: var(--accent); color: var(--bg-primary);
            font-weight: 600; font-size: 0.82rem; border: none;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-nickname-save:hover {
            background: var(--accent-hover); transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(17, 24, 39, 0.25);
        }
        .btn-nickname-save:disabled {
            opacity: 0.6; cursor: not-allowed; transform: none;
        }
        .btn-nickname-cancel {
            padding: 6px 18px; border-radius: 8px;
            background: var(--bg-elevated); color: var(--text-secondary);
            font-weight: 600; font-size: 0.82rem;
            border: 1px solid var(--border-subtle);
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-nickname-cancel:hover {
            border-color: var(--border-accent); color: var(--text-primary);
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.14); }

        @media (max-width: 960px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }
            .profile-sidebar {
                position: fixed; top: 0; left: -320px;
                width: 320px; height: 100vh;
                z-index: 160; border-right: 1px solid var(--border-subtle);
                background: var(--bg-secondary);
                transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                padding-top: 24px;
            }
            .profile-sidebar.open {
                left: 0;
            }
            .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
            .profile-main { padding: 24px 16px 80px; }
            .section-header { flex-direction: column; gap: 12px; align-items: flex-start; }
            .filter-tabs { flex-wrap: wrap; }
        }

        @media (max-width: 600px) {
            .top-bar { padding: 12px 16px; }
            .page-badge { display: none; }
            .blog-card { padding: 18px 18px; }
            .blog-card-footer { flex-direction: column; gap: 10px; align-items: flex-start; }
            .blog-actions { width: 100%; }
            .btn-action { flex: 1; justify-content: center; }
            .stats-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>
    <!-- Top Bar -->
    <nav class="top-bar">
        <a href="/" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M12 8a.5.5 0 0 1-.5.5H5.707l2.147 2.146a.5.5 0 0 1-.708.708l-3-3a.5.5 0 0 1 0-.708l3-3a.5.5 0 1 1 .708.708L5.707 7.5H11.5a.5.5 0 0 1 .5.5z"/>
            </svg>
            返回首页
        </a>
        <div class="page-badge">
            <span class="dot"></span>
            Profile
        </div>
        <button class="btn-create-top" onclick="createBlog()">
            <i class="fas fa-feather-alt"></i>
            写文章
        </button>
    </nav>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Main Layout -->
    <div class="profile-layout">
        <!-- Sidebar -->
        <aside class="profile-sidebar" id="profileSidebar">
            <div class="user-avatar-wrapper">
                <div class="user-avatar">👤</div>
                <div class="nickname-display">
                    <h2 class="user-name" id="profileUserName">用户</h2>
                    <button class="btn-edit-nickname" onclick="showNicknameEdit()" title="修改昵称">
                        <i class="fas fa-pen"></i>
                    </button>
                </div>
                <div class="nickname-edit-form" id="nicknameEditForm">
                    <input type="text" class="nickname-input" id="nicknameInput" placeholder="输入新昵称" maxlength="20">
                    <div class="nickname-edit-actions">
                        <button class="btn-nickname-save" id="btnNicknameSave" onclick="saveNickname()">保存</button>
                        <button class="btn-nickname-cancel" onclick="cancelNicknameEdit()">取消</button>
                    </div>
                </div>
                <p class="user-role">Blogger</p>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">文章</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statPublished">0</div>
                    <div class="stat-label">已发布</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statDraft">0</div>
                    <div class="stat-label">草稿</div>
                </div>
            </div>

            <!-- User Details -->
            <div class="user-details">
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-user"></i></div>
                    <div class="detail-text">
                        <div class="detail-label">用户名</div>
                        <div class="detail-value" id="profileUserNameValue">-</div>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-envelope"></i></div>
                    <div class="detail-text">
                        <div class="detail-label">邮箱</div>
                        <div class="detail-value" id="profileEmail">-</div>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-icon"><i class="fas fa-phone"></i></div>
                    <div class="detail-text">
                        <div class="detail-label">手机号</div>
                        <div class="detail-value" id="profilePhone">-</div>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="sidebar-actions">
                <button class="btn-sidebar btn-switch" onclick="switchAccount()">
                    <i class="fas fa-exchange-alt"></i> 切换账户
                </button>
                <button class="btn-sidebar btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> 退出登录
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="profile-main">
            <div class="section-header">
                <h2 class="section-title">我的<span class="title-accent">文章</span></h2>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all" onclick="filterBlogs('all')">
                    全部 <span class="tab-count" id="countAll">0</span>
                </button>
                <button class="filter-tab" data-filter="published" onclick="filterBlogs('published')">
                    已发布 <span class="tab-count" id="countPublished">0</span>
                </button>
                <button class="filter-tab" data-filter="draft" onclick="filterBlogs('draft')">
                    草稿 <span class="tab-count" id="countDraft">0</span>
                </button>
            </div>

            <!-- Loading -->
            <div id="blogLoading" class="blog-loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p class="loading-text" style="margin-top: 15px; color: var(--text-secondary); font-size: 0.9rem;">加载中…</p>
            </div>

            <!-- Blog List -->
            <div id="blogList">
                <!-- Blog cards loaded by JS -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📝</div>
                <h3>还没有博客</h3>
                <p>开始您的创作之旅，写下第一篇文章吧！</p>
                                <a href="/blog-editor" class="btn-empty-create" target="_blank" rel="noopener">
                    <i class="fas fa-feather-alt"></i> 创建文章
                </a>
            </div>

            <!-- Pagination -->
            <div class="pagination-container" id="pagination">
                <!-- Pagination loaded by JS -->
            </div>
        </main>
    </div>

    <!-- Mobile sidebar toggle -->
    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
        <i class="fas fa-user"></i>
    </button>

    <script src="../assets/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
