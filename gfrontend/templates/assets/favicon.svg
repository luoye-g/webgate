<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(12, 10)">
    <!-- Paper -->
    <rect x="2" y="6" width="28" height="36" rx="3" fill="white" opacity="0.95"/>
    <line x1="8" y1="15" x2="24" y2="15" stroke="#c0c0e0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="21" x2="22" y2="21" stroke="#c0c0e0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="27" x2="20" y2="27" stroke="#c0c0e0" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="33" x2="18" y2="33" stroke="#c0c0e0" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Pen -->
    <g transform="translate(18, -2) rotate(30, 20, 22)">
      <rect x="17" y="4" width="6" height="28" rx="1.5" fill="url(#pen)" stroke="#999" stroke-width="0.5"/>
      <polygon points="17,32 20,40 23,32" fill="#ffb74d"/>
      <rect x="17" y="4" width="6" height="5" rx="1.5" fill="#e57373"/>
